<!DOCTYPE html>
<html lang="en">

<head>

    <title>Fruits Page</title>

        }

        #main-heading {
            color: darkgreen;
            text-align: center;

        .list {
            list-style: none;
            padding: 0;

            border-bottom: 1px solid gray;

<body>

    <ul class="list">

        <li class="item">🍌 Banana</li>
        <li class="item">🍊 Orange</li>
    </ul>

</body>

</html>
