<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .highlight::before {
            content: ">> ";
            color: red;
        }

        .highlight::after {
            content: " <<";
            color: red;
        }
    </style>
</head>

<body>

    <h1>Before and After Pseudo-Elements</h1>

    <p>This is a paragraph with a <span class="highlight">highlighted</span> word.</p>

</body>

</html>
