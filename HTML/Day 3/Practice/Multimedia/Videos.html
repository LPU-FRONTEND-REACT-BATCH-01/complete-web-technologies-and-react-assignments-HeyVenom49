<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Multimedia Demo</title>
</head>

<body>

    <h2>🎥 Video (Local)</h2>
    <video width="500" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video
    </video>

    <hr>

    <h2>🎵 Audio</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio
    </audio>

    <hr>

    <h2>📺 YouTube Video (iframe)</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen>
    </iframe>

    <hr>

    <h2>🗺️ Google Map</h2>
    <iframe src="https://www.google.com/maps?q=Delhi&output=embed" width="600" height="450" style="border:0;"
        allowfullscreen="" loading="lazy">
    </iframe>

</body>

</html>
